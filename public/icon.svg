<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="nv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1A14" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <linearGradient id="nv-gold" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="28" y2="28">
      <stop offset="0%" stop-color="#F5C065" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="nv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect width="32" height="32" rx="7" fill="url(#nv-bg)" stroke="#E5A93C" stroke-width="1.2" stroke-opacity="0.45" />
  
  <!-- Hexagonal Multiverse Portal "N" -->
  <g transform="translate(4, 4)" fill="none" stroke="url(#nv-gold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagon -->
    <path d="M12 2l8.5 4.9v9.8L12 21.5 3.5 16.7V6.9L12 2z" stroke-width="1.8" />
    
    <!-- Dimensional "N" Pillars and Geodesic -->
    <line x1="7.5" y1="6.6" x2="7.5" y2="17.4" stroke-width="2" />
    <line x1="16.5" y1="6.6" x2="16.5" y2="17.4" stroke-width="2" />
    <line x1="7.5" y1="7.5" x2="16.5" y2="16.5" stroke-width="2" />
    
    <!-- Central Singularity Diamond -->
    <polygon points="12,8.5 14.5,12 12,15.5 9.5,12" stroke-width="1.2" fill="#E5A93C" fill-opacity="0.3" />
    
    <!-- Radiant Singularity Core -->
    <circle cx="12" cy="12" r="1.3" fill="#FFFBEB" stroke="none" filter="url(#nv-glow)" />
  </g>
</svg>
